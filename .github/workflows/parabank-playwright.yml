name: ParaBank Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      # Download the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js for the Playwright project.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install the exact dependency versions from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers and Linux dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run the API test suite independently from UI authentication.
      - name: Run API tests
        run: npx playwright test --config=playwright.api.config.ts

      # Run the registration test without global authentication setup.
      - name: Run registration test
        run: npx playwright test --config=playwright.registration.config.ts --timeout=90000

      # Run the reliable regression test across all three browsers.
      - name: Run cross-browser regression tests
        run: npx playwright test --config=playwright.login.config.ts --grep "@regression" --workers=3 --timeout=90000

      # Upload the Playwright report if any test fails.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7